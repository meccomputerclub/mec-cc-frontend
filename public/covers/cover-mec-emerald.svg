<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f17" />
      <stop offset="50%" stop-color="#062e22" />
      <stop offset="100%" stop-color="#02140f" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(16, 185, 129, 0.12)" stroke-width="1.2"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(52, 211, 153, 0.18)" />
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)" />
  <rect width="1200" height="320" fill="url(#grid)" />
  <rect width="1200" height="320" fill="url(#dots)" />

  <!-- Accent glowing lines -->
  <path d="M0,240 Q300,180 600,220 T1200,140" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.6" />
  <path d="M0,260 Q400,200 800,250 T1200,180" fill="none" stroke="#34d399" stroke-width="1" opacity="0.4" />
  <path d="M0,80 L400,80 L460,140 L900,140 L940,100 L1200,100" fill="none" stroke="#10b981" stroke-width="2" opacity="0.5" stroke-dasharray="6,4" />

  <!-- Cyber Nodes -->
  <circle cx="460" cy="140" r="5" fill="#34d399" />
  <circle cx="900" cy="140" r="5" fill="#10b981" />
  <circle cx="940" cy="100" r="4" fill="#a7f3d0" />

  <!-- Tech Stamp & Badge -->
  <g transform="translate(980, 40)" opacity="0.75">
    <rect x="0" y="0" width="180" height="44" rx="4" fill="#041f17" stroke="#10b981" stroke-width="1.5" />
    <text x="14" y="26" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="2">MEC//EMERALD</text>
  </g>
  <g transform="translate(40, 260)" opacity="0.65">
    <text x="0" y="0" fill="#a7f3d0" font-family="monospace" font-size="11" letter-spacing="3">// SYSTEM ACTIVE · 0x8824 · MEC COMPUTER CLUB</text>
  </g>
</svg>
