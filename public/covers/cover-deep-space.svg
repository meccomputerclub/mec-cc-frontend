<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518" />
      <stop offset="50%" stop-color="#140c2b" />
      <stop offset="100%" stop-color="#060210" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <pattern id="hex" width="50" height="43.3" patternUnits="userSpaceOnUse">
      <polygon points="25,0 50,14.43 50,43.3 25,28.87 0,43.3 0,14.43" fill="none" stroke="rgba(139, 92, 246, 0.12)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)" />
  <rect width="1200" height="320" fill="url(#hex)" />

  <!-- Neon Flow Paths -->
  <path d="M0,180 C300,100 600,280 1200,160" fill="none" stroke="url(#glow)" stroke-width="3" opacity="0.75" />
  <path d="M0,200 C400,320 800,80 1200,220" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.4" />

  <!-- Constellation Nodes -->
  <circle cx="280" cy="130" r="4" fill="#ec4899" />
  <circle cx="480" cy="220" r="6" fill="#a855f7" />
  <circle cx="750" cy="180" r="5" fill="#818cf8" />
  <circle cx="980" cy="160" r="4" fill="#c084fc" />

  <!-- Badge -->
  <g transform="translate(980, 40)" opacity="0.8">
    <rect x="0" y="0" width="180" height="44" rx="4" fill="#140c2b" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="18" y="26" fill="#c084fc" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="2">NEBULA//CORE</text>
  </g>
</svg>
