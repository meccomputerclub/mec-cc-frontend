<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c18" />
      <stop offset="60%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#110e2e" />
    </linearGradient>
    <pattern id="iso-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#cyber-bg)"/>
  <rect width="1200" height="400" fill="url(#iso-grid)"/>

  <!-- Glowing Cyan Top Accent -->
  <line x1="0" y1="16" x2="1200" y2="16" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="14 7"/>

  <!-- Geometric Polygonal Network on Left -->
  <g stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.4" fill="none">
    <polygon points="120,40 220,100 160,190 60,130" fill="rgba(0, 240, 255, 0.05)"/>
    <polygon points="220,100 340,70 300,170 160,190" fill="rgba(168, 85, 247, 0.05)"/>
    <polygon points="340,70 450,110 390,200 300,170" fill="rgba(0, 240, 255, 0.04)"/>
    <circle cx="120" cy="40" r="4" fill="#00f0ff"/>
    <circle cx="220" cy="100" r="4" fill="#a855f7"/>
    <circle cx="160" cy="190" r="4" fill="#00f0ff"/>
    <circle cx="340" cy="70" r="4" fill="#38bdf8"/>
    <circle cx="300" cy="170" r="4" fill="#a855f7"/>
    <circle cx="450" cy="110" r="4" fill="#00f0ff"/>
  </g>

  <!-- Big Bold Brutalist Monospace Typography Center/Right -->
  <g transform="translate(560, 45)">
    <rect x="0" y="0" width="580" height="150" rx="8" fill="#081426" stroke="#00f0ff" stroke-width="2"/>
    <rect x="0" y="0" width="580" height="26" rx="8" fill="#0f2747"/>
    <text x="16" y="17" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="900" letter-spacing="1">CYBER_NETWORK // MEC_SECURITY_LAYER</text>
    
    <text x="20" y="55" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="900">CRYPTOGRAPHIC_PRIMITIVES: AES-256-GCM</text>
    <text x="20" y="80" fill="#a855f7" font-family="monospace" font-size="13" font-weight="bold">&gt; SHA3_512: d41d8cd98f00b204e9800998ecf8427e</text>
    <text x="20" y="105" fill="#38bdf8" font-family="monospace" font-size="12">&gt; SYMMETRIC KEY EXCHANGE: ECDH_SECP384R1</text>
    <text x="20" y="130" fill="#22c55e" font-family="monospace" font-size="12" font-weight="bold">&gt; TLS HANDSHAKE VERIFIED // ENCRYPTED TUNNEL</text>
  </g>

  <!-- Floating Tech Badges -->
  <rect x="40" y="20" width="130" height="26" rx="4" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-width="1"/>
  <text x="50" y="37" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">PROTOCOL::SECURE</text>

  <!-- Bottom Accent line -->
  <line x1="0" y1="384" x2="1200" y2="384" stroke="#a855f7" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="10 5"/>
</svg>
